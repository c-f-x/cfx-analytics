name: CI

# Pull requests are checked on their merge result (GitHub checks out
# refs/pull/N/merge), so the fast checks run with the change merged in.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # GitHub's hosted runners: a public repository must not run pull
    # requests' code on the owner's Mac. CI_RUNS_ON can name others, as JSON.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The schema-step check compares against origin/master.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # The default (~/setup-pnpm) is shared by every job on a self-hosted machine.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The c-f-x repository standard (cfx-kit, #42). The rest of its checks
      # join here as this repository meets them.
      - run: pnpm exec c-f-x check docs
      - run: pnpm exec c-f-x check wrangler-config
