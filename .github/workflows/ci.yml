name: CI

# Pull requests are checked on their merge result (GitHub checks out
# refs/pull/N/merge), so the fast checks run with the change merged in.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # GitHub's hosted runners: a public repository must not run pull
    # requests' code on the owner's Mac. CI_RUNS_ON can name others, as JSON.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The schema-step check compares against origin/master.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # The default (~/setup-pnpm) is shared by every job on a self-hosted machine.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
