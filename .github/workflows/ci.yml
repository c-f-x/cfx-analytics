name: CI

# Pull requests are checked on their merge result (GitHub checks out
# refs/pull/N/merge), so the fast checks run with the change merged in.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Runs on the owner's Mac (see the ci-runner skill). CI_RUNS_ON overrides it.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "macOS", "cfanalytics"]') }}
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The schema-step check compares against origin/master.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # The default (~/setup-pnpm) is shared by every job on a self-hosted machine.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
